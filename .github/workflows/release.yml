# Builds the plugin on a semver tag and stages a DRAFT GitHub Release with the
# unsigned zip + .sha256 sidecar:
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# The draft is never published by CI. Release flow from here (see RELEASING.md):
# build and sign locally (YubiKey, -Psigning), replace the draft's zip AND
# regenerate its .sha256 sidecar from the signed zip, publish by hand, then
# submit the published release to the community catalog.
#
# The tag must match the version in every file that carries it (RELEASING.md,
# step 1), so CI builds the committed files as they are, the same way the signed
# build does, and plugin.xml's pluginVersion (what the engine reports as
# "installed") matches oie.json, keeping the store's update detection accurate.
# The engine version comes from the POM's mc.version (see build.yml for why it
# is not hardcoded here).
#
# A tag whose release is already published is refused, so re-running this
# workflow can never replace a published release's files with an unsigned
# build. An existing draft is updated: publishing it is the last, manual step.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Refuse a tag whose release is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>&1)"; then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published. Its files are never replaced; release a new version."
              exit 1
            fi
            echo "A draft exists for ${GITHUB_REF_NAME}; it will be updated."
          elif [ "$DRAFT" = "release not found" ]; then
            echo "No release exists for ${GITHUB_REF_NAME} yet."
          else
            # Anything else (network, permissions) must not be taken for "no release".
            echo "::error::Could not check for an existing release: $DRAFT"
            exit 1
          fi

      - name: Check the tag against every version file
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HELP=org.apache.maven.plugins:maven-help-plugin:3.5.1
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is version ${VERSION}, but $1 says '$2'."
              FAILED=1
            fi
          }
          FAILED=0
          check "pom.xml <revision>" "$(mvn -q -N "$HELP:evaluate" -Dexpression=revision -DforceStdout)"
          check "oie.json version" "$(jq -r .version oie.json)"
          check "package/webadmin/plugin.json version" "$(jq -r .version package/webadmin/plugin.json)"
          check "package/webadmin/package.json version" "$(jq -r .version package/webadmin/package.json)"
          check "package/webadmin/package-lock.json version" "$(jq -r .version package/webadmin/package-lock.json)"
          check "package/webadmin/package-lock.json packages[\"\"].version" \
            "$(jq -r '.packages[""].version' package/webadmin/package-lock.json)"
          # The engine loads a plugin only on the exact version in plugin.xml's mirthVersion (the
          # pom's plugin.supported.mc.versions), so the store listing must say exactly that version too.
          ENGINE="$(mvn -q -N "$HELP:evaluate" -Dexpression=plugin.supported.mc.versions -DforceStdout)"
          for field in minEngineVersion maxEngineVersion; do
            got="$(jq -r ".$field" oie.json)"
            if [ "$got" != "$ENGINE" ]; then
              echo "::error::oie.json $field is '${got}', but the plugin is built for OIE ${ENGINE} (pom.xml plugin.supported.mc.versions), the only version the engine will load it on."
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Set the version in every file listed above (RELEASING.md, step 1) and tag again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve the engine version from the POM
        id: engine
        run: |
          MC_VERSION="$(mvn -q -N help:evaluate -Dexpression=mc.version -DforceStdout)"
          if [ -z "$MC_VERSION" ]; then
            echo "::error::Could not read mc.version from pom.xml"
            exit 1
          fi
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=oie_unix_${MC_VERSION//./_}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Cache OIE distribution
        id: oie-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.engine.outputs.tarball }}
          key: oie-dist-${{ steps.engine.outputs.tag }}

      - name: Download OIE distribution
        if: steps.oie-cache.outputs.cache-hit != 'true'
        env:
          OIE_TAG: ${{ steps.engine.outputs.tag }}
          OIE_TARBALL: ${{ steps.engine.outputs.tarball }}
        run: curl -fSL -o "$OIE_TARBALL" "https://github.com/OpenIntegrationEngine/engine/releases/download/${OIE_TAG}/${OIE_TARBALL}"

      - name: Install engine jars into the local Maven repo
        env:
          OIE_TARBALL: ${{ steps.engine.outputs.tarball }}
          MC_VERSION: ${{ steps.engine.outputs.mc_version }}
        run: |
          tar xzf "$OIE_TARBALL" \
            oie/server-lib/mirth-server.jar \
            oie/server-lib/mirth-client-core.jar \
            oie/client-lib/mirth-client.jar \
            oie/server-lib/donkey/donkey-server.jar
          for pair in \
            "mirth-server:oie/server-lib/mirth-server.jar" \
            "mirth-client-core:oie/server-lib/mirth-client-core.jar" \
            "mirth-client:oie/client-lib/mirth-client.jar" \
            "donkey-server:oie/server-lib/donkey/donkey-server.jar"; do
            a="${pair%%:*}"; p="${pair#*:}"
            mvn -q install:install-file -Dfile="$p" -DgroupId=com.mirth.connect -DartifactId="$a" -Dversion="$MC_VERSION" -Dpackaging=jar
          done

      - name: Build
        run: mvn -B -ntp -DskipTests package

      - name: Stage the release asset and checksum
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="$(find package/target -maxdepth 1 -name 'oie-source-code-search-*.zip' | head -n1)"
          if [ -z "$SRC" ]; then
            echo "::error::No plugin zip found in package/target"; ls -l package/target || true; exit 1
          fi
          ASSET="oie-source-code-search-${VERSION}.zip"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          ( cd out && sha256sum "${ASSET}" > "${ASSET}.sha256" )
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Create DRAFT GitHub Release with assets
        # Stays a draft: the zip is unsigned. A human signs locally, replaces the
        # zip and its .sha256 sidecar, and publishes (see RELEASING.md).
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/${{ steps.pkg.outputs.asset }}
            out/${{ steps.pkg.outputs.asset }}.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
